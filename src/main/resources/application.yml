server:
  port: 8080

spring:
  application:
    name: book-management-system

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - openid
              - profile
              - email

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Cau hinh JWT cho co che Authentication.
# jwt.secret PHAI duoc thay the bang mot gia tri bi mat thuc su va luu qua
# bien moi truong (environment variable) trong moi truong production,
# khong duoc hardcode hoac commit len source control.
jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1saWJyYXJ5LW1hbmFnZW1lbnQtc3lzdGVtLWp3dC1zaWduaW5n}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Refresh token song 7 ngay (7 * 24 * 60 * 60 * 1000 = 604800000 ms)
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

rate-limit:
  authenticated-requests-per-minute: 60
  anonymous-requests-per-minute: 20
  auth-requests-per-minute: 5

oauth2:
  redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:3000/oauth2/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
    com:
      library: debug
